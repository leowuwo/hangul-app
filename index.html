<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>신나는 유아 한글 놀이터</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    * { box-sizing: border-box; font-family: 'Jua', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: #FFF9EC; color: #333; min-height: 100vh; }
    header { background: linear-gradient(135deg, #FF8C42, #FF5E5B); color: #fff; padding: 14px 18px; font-size: 1.4rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .voice-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .voice-select { background: rgba(255,255,255,0.95); color: #333; border: 2px solid #FFE082; padding: 6px 12px; border-radius: 16px; font-size: 0.95rem; cursor: pointer; outline: none; }
    .voice-status { font-size: 0.82rem; background: rgba(0,0,0,0.18); padding: 4px 10px; border-radius: 12px; color: #FFFDF7; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .star-badge { background: #FFD166; color: #5A3A00; padding: 6px 14px; border-radius: 20px; font-size: 1.05rem; }
    nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; background: #FFF1D0; }
    @media (min-width: 768px) { nav { grid-template-columns: repeat(6, 1fr); } }
    .nav-btn { background: #fff; border: 3px solid #FFD166; border-radius: 16px; padding: 10px 6px; font-size: 1rem; cursor: pointer; color: #444; }
    .nav-btn.active { background: #FF7A00; color: #fff; border-color: #D96500; }
    main { padding: 18px; max-width: 920px; margin: 0 auto; }
    .section { display: none; }
    .section.active { display: block; }
    h2 { text-align: center; color: #E06000; font-size: 1.5rem; margin-top: 0; }
    .back-bar { display: flex; justify-content: flex-start; margin-bottom: 14px; }
    .back-btn { background: #6C757D; color: #fff; border: none; padding: 10px 18px; border-radius: 14px; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 #495057; }
    .grid-letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .letter-card { background: #fff; border: 3px solid #4ECDC4; border-radius: 18px; padding: 14px 6px; text-align: center; font-size: 2rem; cursor: pointer; box-shadow: 0 4px 0 #3AB7AE; }
    .letter-card.double-consonant { border-color: #9B5DE5; box-shadow: 0 4px 0 #7B3FC4; }
    .letter-card.vowel { border-color: #FF8C42; box-shadow: 0 4px 0 #E0732C; }
    .letter-name { display: block; font-size: 0.9rem; color: #666; margin-top: 4px; }
    .solo-view { background: #fff; border: 4px solid #FFD166; border-radius: 28px; padding: 36px 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .solo-big-char { font-size: 8rem; line-height: 1.15; color: #FF7A00; margin: 10px 0; }
    .solo-sub { font-size: 1.7rem; color: #555; margin-bottom: 20px; }
    .solo-art { min-height: 360px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    .solo-art .word-emoji { font-size: 14rem; line-height: 1.05; }
    .solo-art svg { width: 360px; height: 360px; max-width: 85vw; max-height: 85vw; }
    .solo-art img { width: 360px !important; height: 360px !important; max-width: 85vw !important; max-height: 85vw !important; }
    .solo-word { font-size: 4.2rem; line-height: 1.2; color: #E06000; margin-bottom: 24px; }
    .combiner-box { background: #fff; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .combined-result { font-size: 5.5rem; color: #FF7A00; background: #FFF5E4; width: 150px; height: 150px; line-height: 150px; margin: 0 auto 15px; border-radius: 30px; border: 4px dashed #FF7A00; cursor: pointer; }
    .selector-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
    .mini-btn { padding: 10px 14px; font-size: 1.3rem; border-radius: 12px; border: 2px solid #DDD; background: #FAFAFA; cursor: pointer; }
    .mini-btn.selected { background: #4ECDC4; color: #fff; border-color: #2A9D8F; }
    .top-category-bar { background: #FFF2D6; border: 3px solid #FFD166; border-radius: 22px; padding: 14px 16px; margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .cat-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .cat-btn { padding: 10px 18px; border-radius: 20px; border: none; background: #E6E6E6; font-size: 1.1rem; cursor: pointer; color: #444; }
    .cat-btn.active { background: #FF5E5B; color: #fff; box-shadow: 0 3px 0 #C9423F; }
    .top-write-btn { background: #2EC4B6; color: #fff; border: none; padding: 10px 22px; border-radius: 18px; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 #1F8E83; }
    .count-info { text-align: center; color: #666; margin-bottom: 10px; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px; }
    .word-card { background: #fff; border-radius: 20px; padding: 18px 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 3px solid #FFE082; cursor: pointer; }
    .word-art { height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .word-emoji { font-size: 5.2rem; line-height: 1; }
    .word-text { font-size: 1.45rem; color: #333; }
    .canvas-container { background: #fff; border-radius: 24px; padding: 20px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    #writeCanvas { width: 100%; max-width: 900px; height: auto; aspect-ratio: 900 / 450; border: 5px solid #4ECDC4; border-radius: 24px; background: #fff; touch-action: none; cursor: crosshair; display: block; margin: 0 auto; }
    .action-btn { background: #FF7A00; color: #fff; border: none; padding: 12px 20px; font-size: 1.15rem; border-radius: 16px; margin: 6px 4px; cursor: pointer; box-shadow: 0 4px 0 #C85500; }
    .action-btn.blue { background: #3A86FF; box-shadow: 0 4px 0 #2667CC; }
    .action-btn.green { background: #2EC4B6; box-shadow: 0 4px 0 #1F8E83; }
    .quiz-box { background: #fff; border-radius: 24px; padding: 25px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .quiz-art { height: 240px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .quiz-art .word-emoji { font-size: 9.5rem; }
    .quiz-art svg { width: 230px; height: 230px; max-width: 80vw; max-height: 80vw; }
    .quiz-art img { width: 230px !important; height: 230px !important; max-width: 80vw !important; max-height: 80vw !important; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .quiz-opt-btn { background: #FFF9EC; border: 3px solid #FFD166; border-radius: 18px; padding: 18px 10px; font-size: 1.6rem; cursor: pointer; }
    .stats-card { background: #fff; border-radius: 24px; padding: 25px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .sticker-board { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 20px; font-size: 2.5rem; background: #FFF5E4; padding: 20px; border-radius: 20px; min-height: 100px; }
  </style>
</head>
<body>
  <header>
    <div>🧸 신나는 한글 놀이터</div>
    <div class="header-right">
      <div class="voice-wrap">
        <select id="voiceProfileSelect" class="voice-select" onchange="changeVoiceProfile()" aria-label="목소리 선택">
          <option value="girl">👧 여자아이 목소리</option>
          <option value="woman">👩 여자 어른 목소리</option>
          <option value="boy">👦 남자아이 목소리</option>
          <option value="man">👨 남자 어른 목소리</option>
        </select>
        <span class="voice-status" id="voiceStatusLabel" title="현재 연결된 음성">엔진 확인 중...</span>
      </div>
      <div class="star-badge">⭐ 별 스티커: <span id="starCount">0</span>개</div>
    </div>
  </header>

  <nav id="mainNav">
    <button type="button" class="nav-btn active" onclick="showTab('tab1', this)">1. 자음·모음</button>
    <button type="button" class="nav-btn" onclick="showTab('tab2', this)">2. 글자 조합</button>
    <button type="button" class="nav-btn" onclick="showTab('tab3', this)">3. 그림 단어</button>
    <button type="button" class="nav-btn" onclick="showTab('tab4', this)">4. 따라 쓰기</button>
    <button type="button" class="nav-btn" onclick="showTab('tab5', this)">5. 한글 퀴즈</button>
    <button type="button" class="nav-btn" onclick="showTab('tab6', this)">6. 나의 공부방</button>
  </nav>

  <main>
    <section id="tab1" class="section active">
      <div id="letterListView">
        <h2>🔤 글자를 눌러 크게 보고 소리를 들어보세요!</h2>
        <h3>기본자음 (14개)</h3>
        <div class="grid-letters" id="consonantGrid"></div>
        <h3>쌍자음 (5개)</h3>
        <div class="grid-letters" id="doubleConsonantGrid"></div>
        <h3>모음 (21개)</h3>
        <div class="grid-letters" id="vowelGrid"></div>
      </div>
      <div id="letterSoloView" class="solo-view" style="display:none;">
        <div class="back-bar"><button type="button" class="back-btn" onclick="closeLetterSolo()">← 뒤로 가기</button></div>
        <div class="solo-big-char" id="soloLetterChar">ㄱ</div>
        <div class="solo-sub" id="soloLetterDesc">기역 · 그</div>
        <button type="button" class="action-btn blue" id="soloLetterSpeakBtn">🔊 소리 듣기</button>
        <button type="button" class="action-btn green" id="soloLetterWriteBtn">✍️ 따라 쓰기</button>
      </div>
    </section>

    <section id="tab2" class="section">
      <h2>🧩 자음과 모음을 합쳐서 읽어보자!</h2>
      <div class="combiner-box">
        <div class="combined-result" id="combinedChar" onclick="speakCurrentCombined()">가</div>
        <button type="button" class="action-btn blue" onclick="speakCurrentCombined()">🔊 소리 듣기</button>
        <button type="button" class="action-btn green" onclick="sendToWrite(document.getElementById('combinedChar').innerHTML)">✍️ 이 글자 따라 쓰기</button>
        <h4>1단계: 자음 선택</h4>
        <div class="selector-row" id="combConsonants"></div>
        <h4>2단계: 모음 선택</h4>
        <div class="selector-row" id="combVowels"></div>
      </div>
    </section>

    <section id="tab3" class="section">
      <div id="wordListView">
        <h2>🖼️ 그림과 단어를 눌러 크게 보세요!</h2>
        <div class="top-category-bar">
          <div class="cat-tabs">
            <button type="button" class="cat-btn active" onclick="filterWords('life', this)">🍎 생활단어</button>
            <button type="button" class="cat-btn" onclick="filterWords('carbot', this)">🤖 헬로카봇</button>
            <button type="button" class="cat-btn" onclick="filterWords('pokemon', this)">⚡ 포켓몬스터</button>
          </div>
          <button type="button" class="top-write-btn" onclick="sendToWrite(selectedWordForWrite)">
            ✍️ <span id="topWriteLabel">단어</span> 따라쓰기
          </button>
        </div>
        <div class="count-info" id="wordCountInfo"></div>
        <div style="text-align:center; margin-bottom:14px;">
          <input type="text" id="wordSearch" placeholder="단어 검색" oninput="renderWords()" style="padding:10px 15px; width:85%; max-width:350px; border-radius:15px; border:2px solid #CCC; font-size:1rem;">
        </div>
        <div class="word-grid" id="wordGrid"></div>
      </div>

      <div id="wordSoloView" class="solo-view" style="display:none;">
        <div class="back-bar"><button type="button" class="back-btn" onclick="closeWordSolo()">← 뒤로 가기</button></div>
        <div class="solo-art" id="soloWordArt"></div>
        <div class="solo-word" id="soloWordText"></div>
        <button type="button" class="action-btn blue" id="soloWordSpeakBtn">🔊 소리 듣기</button>
        <button type="button" class="action-btn green" id="soloWordWriteBtn">✍️ 따라 쓰기</button>
      </div>
    </section>

    <section id="tab4" class="section">
      <div class="back-bar"><button type="button" class="back-btn" onclick="goBackFromWrite()">← 뒤로 가기</button></div>
      <h2>✍️ 손가락으로 글자를 따라 써보세요!</h2>
      <div class="canvas-container">
        <div style="margin-bottom:14px;">
          <span style="font-size:1.5rem;">연습할 단어: </span>
          <strong id="targetWriteWord" style="font-size:2.7rem; color:#FF7A00;">만년필</strong>
          <button type="button" class="mini-btn" onclick="speak(document.getElementById('targetWriteWord').innerHTML)">🔊 듣기</button>
          <button type="button" class="mini-btn" onclick="pickRandomWriteWord(true)">🎲 다른 단어</button>
        </div>
        <canvas id="writeCanvas" width="900" height="450"></canvas>
        <div style="margin-top:12px;">
          <button type="button" class="action-btn" onclick="clearCanvas()">🧹 지우기</button>
          <button type="button" class="action-btn green" onclick="completeWriting()">🎉 다 썼어요! (+별 1개)</button>
        </div>
        <div style="margin-top:12px;"><button type="button" class="back-btn" onclick="goBackFromWrite()">← 뒤로 가기</button></div>
      </div>
    </section>

    <section id="tab5" class="section">
      <h2>🎯 그림과 소리를 듣고 정답을 맞혀요!</h2>
      <div class="quiz-box">
        <div class="quiz-art" id="quizArt"></div>
        <button type="button" class="action-btn blue" onclick="playQuizHint()">🔊 힌트 소리 듣기</button>
        <div class="quiz-options" id="quizOptions"></div>
        <p id="quizFeedback" style="font-size:1.4rem; margin-top:15px; min-height:30px;"></p>
      </div>
    </section>

    <section id="tab6" class="section">
      <h2>🏆 나의 한글 공부방</h2>
      <div class="stats-card">
        <h3>우리 아이 칭찬 스티커 판</h3>
        <div style="font-size:1.3rem; margin:10px 0;">
          ✍️ 따라 쓴 단어 수: <strong id="writtenCount">0</strong>개 |
          🎯 맞힌 퀴즈 수: <strong id="quizScore">0</strong>개
        </div>
        <div class="sticker-board" id="stickerBoard"></div>
        <button type="button" class="action-btn" style="margin-top:20px; background:#888888; box-shadow:none;" onclick="resetProgress()">기록 초기화</button>
      </div>
    </section>
  </main>

  <script>
    var memoryStore = { stars: 0, written: 0, quiz: 0, stickers: [] };
    var progress = loadProgress();
    var voiceProfile = 'girl';
    var previousTabId = 'tab3';
    var cachedVoices = [];

    var voiceConfigs = {
      girl: {
        label: '여자아이',
        sample: '안녕! 나는 여자아이 목소리야. 같이 신나게 한글 공부하자!',
        rate: 1.08,
        pitch: 1.75,
        keywords: ['yuna', 'sora', 'jiyeon', 'female', 'woman', 'girl', 'zira']
      },
      woman: {
        label: '여자 어른',
        sample: '안녕하세요! 다정한 여자 어른 목소리로 읽어줄게요.',
        rate: 0.92,
        pitch: 1.05,
        keywords: ['sun-hi', 'heami', 'female', 'woman', 'yuna']
      },
      boy: {
        label: '남자아이',
        sample: '안녕! 나는 남자아이 목소리야. 힘차게 소리 내어 읽어보자!',
        rate: 1.06,
        pitch: 1.25,
        keywords: ['hyunsu', 'male', 'man', 'boy', 'minsu', 'injoon']
      },
      man: {
        label: '남자 어른',
        sample: '안녕하세요! 듬직한 남자 어른 목소리로 또박또박 들려줄게요.',
        rate: 0.82,
        pitch: 0.55,
        keywords: ['injoon', 'minsu', 'male', 'man', 'david']
      }
    };

    function getKoreanVoices() {
      var list = [];
      for (var i = 0; i < cachedVoices.length; i++) {
        var v = cachedVoices[i];
        if (v.lang && v.lang.toLowerCase().indexOf('ko') === 0) {
          list.push(v);
        }
      }
      return list;
    }

    function refreshVoices() {
      try {
        if ('speechSynthesis' in window) {
          cachedVoices = window.speechSynthesis.getVoices() || [];
          updateVoiceStatusLabel();
        }
      } catch (e) {}
    }

    function updateVoiceStatusLabel() {
      var el = document.getElementById('voiceStatusLabel');
      if (!el) return;
      var koVoices = getKoreanVoices();
      var chosen = pickBestVoice(voiceProfile);
      var cfg = voiceConfigs[voiceProfile] || voiceConfigs.girl;
      if (!('speechSynthesis' in window)) {
        el.innerHTML = '음성 미지원 브라우저';
        return;
      }
      if (koVoices.length === 0) {
        el.innerHTML = '한국어 음성 ' + koVoices.length + '개 · 톤조절(' + cfg.label + ')';
      } else {
        var vName = chosen ? chosen.name : koVoices[0].name;
        el.innerHTML = '한국어 ' + koVoices.length + '개 · ' + vName;
      }
    }

    if ('speechSynthesis' in window) {
      refreshVoices();
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }

    function pickBestVoice(profileKey) {
      var koVoices = getKoreanVoices();
      if (koVoices.length === 0) return null;

      var cfg = voiceConfigs[profileKey] || voiceConfigs.girl;
      for (var k = 0; k < cfg.keywords.length; k++) {
        var kw = cfg.keywords[k];
        for (var j = 0; j < koVoices.length; j++) {
          var vn = (koVoices[j].name || '').toLowerCase();
          if (vn.indexOf(kw) !== -1) {
            return koVoices[j];
          }
        }
      }

      if (koVoices.length >= 2 && (profileKey === 'man' || profileKey === 'boy')) {
        for (var m = 0; m < koVoices.length; m++) {
          var mName = (koVoices[m].name || '').toLowerCase();
          if (mName.indexOf('male') !== -1 || mName.indexOf('minsu') !== -1 || mName.indexOf('injoon') !== -1) {
            return koVoices[m];
          }
        }
        return koVoices[koVoices.length - 1];
      }

      return koVoices[0];
    }

    function changeVoiceProfile() {
      var sel = document.getElementById('voiceProfileSelect');
      voiceProfile = sel ? sel.value : 'girl';
      updateVoiceStatusLabel();
      var cfg = voiceConfigs[voiceProfile] || voiceConfigs.girl;
      speak(cfg.sample);
    }

    function loadProgress() {
      try {
        var raw = window.localStorage.getItem('hangulAppCustomV1');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return memoryStore;
    }

    function saveProgress() {
      memoryStore = progress;
      try { window.localStorage.setItem('hangulAppCustomV1', JSON.stringify(progress)); } catch (e) {}
    }

    function playChime(ok) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var freqs = ok ? [523.25, 659.25, 783.99, 1046.5] : [330, 261.63];
        for (var i = 0; i < freqs.length; i++) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freqs[i];
          var t = ctx.currentTime + i * 0.09;
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        }
      } catch (e) {}
    }

    function speak(text) {
      try {
        if (!('speechSynthesis' in window)) return;
        refreshVoices();
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        var chosen = pickBestVoice(voiceProfile);
        if (chosen) u.voice = chosen;
        var cfg = voiceConfigs[voiceProfile] || voiceConfigs.girl;
        u.rate = cfg.rate;
        u.pitch = cfg.pitch;
        setTimeout(function() {
          try { window.speechSynthesis.speak(u); } catch (err) {}
        }, 30);
      } catch (e) {}
    }

    var consonants = [
      { ch: 'ㄱ', name: '기역', sound: '그' }, { ch: 'ㄴ', name: '니은', sound: '느' },
      { ch: 'ㄷ', name: '디귿', sound: '드' }, { ch: 'ㄹ', name: '리을', sound: '르' },
      { ch: 'ㅁ', name: '미음', sound: '므' }, { ch: 'ㅂ', name: '비읍', sound: '브' },
      { ch: 'ㅅ', name: '시옷', sound: '스' }, { ch: 'ㅇ', name: '이응', sound: '으' },

    function initCombiner() {

        (function(c) {

    function updateCombined() {
      var ci = CHO.indexOf(selCho), ji = JUNG.indexOf(selJung);
      if (ci < 0 || ji < 0) return;
      var ch = String.fromCharCode(0xAC00 + (ci * 21 * 28) + (ji * 28));
      document.getElementById('combinedChar').innerHTML = ch;
      speak(selCho + '랑 ' + selJung + ' 만나서, ' + ch + '!');
    }

    function renderArtHTML(item, isLarge) {
      var largeSize = 360;
      if (item.svg) {
        return item.svg;
      }
      if (item.img) {
        var sz = isLarge ? largeSize : 116;
        var fallback = (item.cat === 'carbot' || item.cat === 'pokemon')
          ? 'data:image/svg+xml;utf8,' + encodeURIComponent(createCharacterSVG(item, sz))
          : '';
        var onErr = fallback
          ? "this.onerror=null;this.src='" + fallback + "';"
          : "this.onerror=null;this.outerHTML='<div class=\"word-emoji\">' + " + JSON.stringify(item.emoji || '✨') + " + '</div>';";
        return '<img src="' + item.img + '" alt="' + item.word + '" loading="lazy" onerror="' + onErr + '" style="width:' + sz + 'px;height:' + sz + 'px;object-fit:contain;border-radius:18px;">';
      }
      if (item.cat === 'carbot' || item.cat === 'pokemon') {
        return createCharacterSVG(item, isLarge ? largeSize : 116);
      }
      return '<div class="word-emoji">' + (item.emoji || '✨') + '</div>';
    }

    var currentCategory = 'life';
    var selectedWordForWrite = '';

    function filterWords(cat, btn) {
      currentCategory = cat;
      var btns = document.querySelectorAll('.cat-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      if (btn) btn.classList.add('active');
      closeWordSolo();
      renderWords();
    }

    function openWordSolo(item) {
      selectedWordForWrite = item.word;
      document.getElementById('topWriteLabel').innerHTML = item.word;
      document.getElementById('wordListView').style.display = 'none';
      document.getElementById('wordSoloView').style.display = 'block';
      document.getElementById('soloWordArt').innerHTML = renderArtHTML(item, true);
      document.getElementById('soloWordText').innerHTML = item.word;
      document.getElementById('soloWordSpeakBtn').onclick = function() { speak(item.word); };
      document.getElementById('soloWordWriteBtn').onclick = function() { previousTabId = 'tab3'; sendToWrite(item.word); };
      speak(item.word);
    }

    function closeWordSolo() {
      document.getElementById('wordSoloView').style.display = 'none';
      document.getElementById('wordListView').style.display = 'block';
    }

    function renderWords() {
      var grid = document.getElementById('wordGrid');
      var kw = (document.getElementById('wordSearch').value || '').replace(/^\s+|\s+$/g, '');
      grid.innerHTML = '';
      var total = 0, filtered = [];
      for (var i = 0; i < wordDatabase.length; i++) {
        if (wordDatabase[i].cat === currentCategory) {
          total++;
          if (kw === '' || wordDatabase[i].word.indexOf(kw) !== -1) filtered.push(wordDatabase[i]);
        }
      }
      var label = (currentCategory === 'life') ? '생활단어' : ((currentCategory === 'carbot') ? '헬로카봇' : '포켓몬스터');
      document.getElementById('wordCountInfo').innerHTML = label + ': 총 ' + total + '개 등록됨 (현재 ' + filtered.length + '개 표시)';

      if (filtered.length > 0) {
        selectedWordForWrite = filtered[0].word;
        document.getElementById('topWriteLabel').innerHTML = filtered[0].word;
      } else {
        selectedWordForWrite = '';
        document.getElementById('topWriteLabel').innerHTML = '단어';
      }

      for (var j = 0; j < filtered.length; j++) {
        (function(item) {
          var card = document.createElement('div');
          card.className = 'word-card';
          card.innerHTML = '<div class="word-art">' + renderArtHTML(item, false) + '</div><div class="word-text">' + item.word + '</div>';
          card.onclick = function() { openWordSolo(item); };
          grid.appendChild(card);
        })(filtered[j]);
      }
    }

    var canvas = document.getElementById('writeCanvas');
    var ctx = canvas.getContext('2d');
    var isDrawing = false;

    function drawGuideText(word) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!word) return;
      ctx.save();
      ctx.fillStyle = '#E6E6E6';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      var baseSize = (word.length <= 2) ? 405 : ((word.length <= 4) ? 330 : 255);
      ctx.font = 'bold ' + baseSize + 'px Jua, sans-serif';
      var maxWidth = canvas.width - 70;
      var measured = ctx.measureText(word).width;
      if (measured > maxWidth) {
        baseSize = Math.floor(baseSize * (maxWidth / measured));
        ctx.font = 'bold ' + baseSize + 'px Jua, sans-serif';
      }

      ctx.fillText(word, canvas.width / 2, canvas.height / 2 + 12);
      ctx.restore();
    }

    function clearCanvas() { drawGuideText(document.getElementById('targetWriteWord').innerHTML); }

    function pickRandomWriteWord(shouldSpeak) {
      var currentWord = document.getElementById('targetWriteWord').innerHTML;
      var candidates = [];
      for (var i = 0; i < wordDatabase.length; i++) {
        if (wordDatabase[i].word && wordDatabase[i].word !== currentWord) {
          candidates.push(wordDatabase[i].word);
        }
      }
      if (candidates.length === 0) return;
      var nextWord = candidates[Math.floor(Math.random() * candidates.length)];
      document.getElementById('targetWriteWord').innerHTML = nextWord;
      clearCanvas();
      if (shouldSpeak) {
        speak(nextWord);
      }
    }

    function sendToWrite(word) {
      if (!word) return;
      document.getElementById('targetWriteWord').innerHTML = word;
      showTab('tab4', document.querySelectorAll('#mainNav .nav-btn')[3]);
      clearCanvas();
      speak(word + ', 손가락으로 따라 써보세요!');
    }

    function goBackFromWrite() {
      var idx = (previousTabId === 'tab1') ? 0 : ((previousTabId === 'tab2') ? 1 : 2);
      showTab(previousTabId, document.querySelectorAll('#mainNav .nav-btn')[idx]);
    }

    function getPos(e) {
      var r = canvas.getBoundingClientRect();
      var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
    }

    function startDraw(e) { isDrawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#FF5E5B'; }
    function moveDraw(e) { if (!isDrawing) return; if (e.cancelable) e.preventDefault(); var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    window.addEventListener('touchend', endDraw);

    function completeWriting() {
      playChime(true);
      addReward('write');
      pickRandomWriteWord(false);
      var nextWord = document.getElementById('targetWriteWord').innerHTML;
      speak('참 잘했어요! 별 스티커를 받았어요! 이번엔 ' + nextWord + '를 따라 써보세요!');
    }

    var currentQuiz = null;
    var quizAnswered = false;
    var quizNextTimer = null;

    function playQuizHint() {
      if (currentQuiz) speak(currentQuiz.word);
    }

    function generateQuiz() {
      if (quizNextTimer) {
        clearTimeout(quizNextTimer);
        quizNextTimer = null;
      }
      quizAnswered = false;

      var box = document.getElementById('quizOptions');
      if (wordDatabase.length === 0) {
        document.getElementById('quizArt').innerHTML = '';
        box.innerHTML = '<p style="grid-column:1/-1;">단어를 먼저 추가해 주세요!</p>';
        return;
      }

      var pool = wordDatabase.slice(0).sort(function() { return 0.5 - Math.random(); });
      currentQuiz = pool[0];
      var opts = pool.slice(0, 4).sort(function() { return 0.5 - Math.random(); });

      document.getElementById('quizArt').innerHTML = renderArtHTML(currentQuiz, true);
      document.getElementById('quizFeedback').innerHTML = '';
      box.innerHTML = '';

      for (var i = 0; i < opts.length; i++) {
        (function(o) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'quiz-opt-btn';
          b.innerHTML = o.word;
          b.onclick = function() { checkQuiz(o.word); };
          box.appendChild(b);
        })(opts[i]);
      }
    }

    function checkQuiz(ans) {
      if (quizAnswered || !currentQuiz) return;

      var fb = document.getElementById('quizFeedback');
      if (ans === currentQuiz.word) {
        quizAnswered = true;
        var opts = document.querySelectorAll('#quizOptions .quiz-opt-btn');
        for (var i = 0; i < opts.length; i++) {
          opts[i].disabled = true;
        }

        playChime(true);
        fb.style.color = '#2EC4B6';
        fb.innerHTML = '🎉 정답이에요! 다음 문제로 넘어가요!';
        speak('정답! ' + currentQuiz.word + '!');
        addReward('quiz');

        quizNextTimer = setTimeout(function() {
          generateQuiz();
        }, 1200);
      } else {
        playChime(false);
        fb.style.color = '#FF5E5B';
        fb.innerHTML = '😅 다시 한 번 생각해 볼까요?';
        speak('다시 한 번 골라보세요!');
      }
    }

    var stickers = ['🦖', '🦄', '🚀', '👑', '🌈', '🐬', '🦁', '🍓', '🤖', '⚡'];
    function addReward(t) {
      progress.stars += 1;
      if (t === 'write') progress.written += 1;
      if (t === 'quiz') progress.quiz += 1;
      progress.stickers.push(stickers[Math.floor(Math.random() * stickers.length)]);
      saveProgress(); updateStudyUI();
    }

    function updateStudyUI() {
      document.getElementById('starCount').innerHTML = progress.stars;
      document.getElementById('writtenCount').innerHTML = progress.written;
      document.getElementById('quizScore').innerHTML = progress.quiz;
      document.getElementById('stickerBoard').innerHTML = progress.stickers.length ? progress.stickers.join(' ') : '아직 스티커가 없어요. 공부를 시작해 볼까요?';
    }

    function resetProgress() {
      if (confirm('정말 모든 스티커와 기록을 초기화할까요?')) {
        progress = { stars: 0, written: 0, quiz: 0, stickers: [] };
        saveProgress(); updateStudyUI();
      }
    }

    function showTab(tabId, btn) {
      if (tabId !== 'tab4') previousTabId = tabId;
      var secs = document.querySelectorAll('.section');
      for (var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
      var navs = document.querySelectorAll('#mainNav .nav-btn');
      for (var j = 0; j < navs.length; j++) navs[j].classList.remove('active');
      var target = document.getElementById(tabId);
      if (target) target.classList.add('active');
      if (btn) btn.classList.add('active');
      if (tabId === 'tab1') closeLetterSolo();
      if (tabId === 'tab3') closeWordSolo();
      if (tabId === 'tab4') clearCanvas();
      if (tabId === 'tab5') generateQuiz();
      if (tabId === 'tab6') updateStudyUI();
    }

    initLetters();
    initCombiner();
    renderWords();
    clearCanvas();
    updateStudyUI();
  </script>
